<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>公众号文章预览</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #eef2f6;
      color: #29323d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 12px 16px;
      border-bottom: 1px solid #dce3eb;
      background: rgba(255, 255, 255, 0.96);
    }

    .toolbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      width: min(100%, 677px);
      margin: 0 auto;
    }

    .toolbar-copy {
      flex: none;
      min-height: 40px;
      padding: 9px 16px;
      border: 0;
      border-radius: 6px;
      background: #246ba5;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .toolbar-copy:focus-visible {
      outline: 3px solid rgba(36, 107, 165, 0.28);
      outline-offset: 2px;
    }

    .toolbar-status {
      margin: 0;
      color: #536273;
      font-size: 13px;
      line-height: 1.5;
      text-align: right;
    }

    .preview-shell {
      width: min(calc(100% - 24px), 725px);
      margin: 24px auto;
      padding: 20px;
      background: #fff;
      box-shadow: 0 12px 34px rgba(37, 55, 76, 0.08);
    }

    #wechat-article pre {
      scrollbar-width: thin;
      scrollbar-color: #3d5a7a transparent;
    }

    #wechat-article pre::-webkit-scrollbar {
      height: 7px;
    }

    #wechat-article pre::-webkit-scrollbar-track {
      background: transparent;
    }

    #wechat-article pre::-webkit-scrollbar-thumb {
      background: #3d5a7a;
      border-radius: 4px;
    }

    #wechat-article pre::-webkit-scrollbar-thumb:hover {
      background: #4a6b8f;
    }

    @media (max-width: 560px) {
      .toolbar-inner {
        align-items: stretch;
        flex-direction: column;
        gap: 8px;
      }

      .toolbar-status {
        text-align: left;
      }

      .preview-shell {
        width: 100%;
        margin: 0;
        padding: 16px 12px;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-inner">
      <button class="toolbar-copy" id="copy-button" type="button">复制到公众号</button>
      <p class="toolbar-status" id="copy-status" role="status" aria-live="polite">复制后直接粘贴到微信公众号编辑器</p>
    </div>
  </header>

  <main class="preview-shell">
    {{ARTICLE_HTML}}
  </main>

  <script>
    const article = document.querySelector("#wechat-article");
    const button = document.querySelector("#copy-button");
    const status = document.querySelector("#copy-status");

    function selectArticle() {
      const selection = window.getSelection();
      const range = document.createRange();
      range.selectNode(article);
      selection.removeAllRanges();
      selection.addRange(range);
      return selection;
    }

    function setStatus(message) {
      status.textContent = message;
    }

    function buildCopyContent() {
      const clone = article.cloneNode(true);
      const headings = clone.querySelectorAll("h1");
      headings.forEach(function (h) { h.remove(); });
      return clone;
    }

    async function copyArticle() {
      if (!article) {
        setStatus("未找到文章内容，请检查模板占位符");
        return;
      }

      const clone = buildCopyContent();
      const html = clone.outerHTML;
      const plain = clone.innerText;

      if (navigator.clipboard && window.ClipboardItem) {
        try {
          const item = new ClipboardItem({
            "text/html": new Blob([html], { type: "text/html" }),
            "text/plain": new Blob([plain], { type: "text/plain" })
          });
          await navigator.clipboard.write([item]);
          setStatus("已复制正文（不含标题），可直接粘贴到微信公众号编辑器");
          return;
        } catch (error) {
          // 本地文件或浏览器权限可能阻止 Clipboard API，继续兼容复制。
        }
      }

      // 兼容复制：选中克隆节点（已移除 h1），提示用户手动按 Ctrl/Cmd+C。
      // 手动复制会保留 HTML 格式（含行内样式），execCommand("copy") 只能复制纯文本。
      clone.style.position = "fixed";
      clone.style.left = "-9999px";
      clone.style.top = "0";
      document.body.appendChild(clone);

      const selection = window.getSelection();
      const range = document.createRange();
      range.selectNodeContents(clone);
      selection.removeAllRanges();
      selection.addRange(range);

      setStatus("正文已选中，请按 Ctrl/Cmd+C 复制（保留富文本格式）");

      // 30 秒后自动清理克隆节点和选区
      setTimeout(function () {
        clone.remove();
        selection.removeAllRanges();
      }, 30000);
    }

    button.addEventListener("click", copyArticle);
  </script>
</body>
</html>
